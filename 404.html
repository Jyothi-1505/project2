<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Bakers Corner</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Global CSS -->
    <link rel="stylesheet" href="./assets/css/common.css">

    <!-- 404 CSS -->
    <link rel="stylesheet" href="404.css">
</head>

<body>

    <main class="error-page">

        <div class="error-card">

            <!-- =========================================
                 CARD TOP
            ========================================== -->

            <div class="error-card-header">

                <!-- Logo + Name -->
                <a href="index.html" class="error-brand">

                    <span class="error-brand-icon">
                        <i data-lucide="chef-hat"></i>
                    </span>

                    <span class="error-brand-name">
                        Bakers<span>Corner</span>
                    </span>

                </a>


                <!-- Controls -->
                <div class="error-controls">

                    <button
                        type="button"
                        class="error-control-button"
                        id="theme-toggle"
                        aria-label="Toggle dark mode"
                    >
                        <i data-lucide="sun"></i>
                    </button>

                    <button
                        type="button"
                        class="error-control-button"
                        id="rtl-toggle"
                        aria-label="Toggle RTL"
                    >
                        RTL
                    </button>

                </div>

            </div>


            <!-- =========================================
                 404 CONTENT
            ========================================== -->

            <div class="error-content">

                <div class="error-number">

                    <span>4</span>

                    <div class="error-cookie">
                        <i data-lucide="cookie"></i>
                    </div>

                    <span>4</span>

                </div>


                <span class="error-eyebrow">
                    404 / PAGE NOT FOUND
                </span>


                <h1>
                    Oops! This page
                    <em>isn't baked yet.</em>
                </h1>


                <p>
                    Looks like you've wandered off the recipe.
                    The page you're looking for may have moved,
                    disappeared, or never existed.
                </p>


                <!-- Buttons -->

                <div class="error-actions">

                    <a href="index.html" class="error-primary-button">
                        BACK TO HOME
                        <i data-lucide="arrow-up-right"></i>
                    </a>

                    <a href="products.html" class="error-secondary-button">
                        EXPLORE PRODUCTS
                        <i data-lucide="arrow-right"></i>
                    </a>

                </div>


                <!-- Bottom Tag -->

                <div class="error-bottom">

                    <span></span>

                    <p>FOR EVERY BAKER IN YOU</p>

                    <span></span>

                </div>

            </div>

        </div>

    </main>


    <script>
        lucide.createIcons();
    </script>

    <script src="./assets/js/common.js"></script>

</body>
</html>
