    <!-- =========================================
         BOOK NOW MAIN
    ========================================= -->
    <main class="book-page-main">

        <div class="book-form-card">

            <!-- Form Heading -->
            <div class="book-form-heading">

                <span class="book-form-eyebrow">
                    <i data-lucide="calendar-check"></i>
                    Book With Us
                </span>

                <h1>
                    Tell Us What
                    <span>You Need.</span>
                </h1>

                <p>
                    Share your requirements with us and our team
                    will get back to you with the right solution.
                </p>

            </div>


            <!-- =========================================
                 FORM
            ========================================= -->
            <form
                class="book-enquiry-form"
                id="bookEnquiryForm"
                action="#"
                method="post">


                <!-- Enquiry Type -->
                <div class="book-form-group">

                    <label for="enquiry-type">
                        What would you like to book?
                    </label>

                    <div class="book-input-wrapper">

                        <i data-lucide="layers"></i>

                        <select
                            id="enquiry-type"
                            name="enquiry-type"
                            required>

                            <option value="">
                                Select enquiry type
                            </option>

                            <option value="bulk-order">
                                Bulk Order
                            </option>

                            <option value="event-order">
                                Event Order
                            </option>

                            <option value="bakery-equipment">
                                Bakery Equipment
                            </option>

                            <option value="baking-supplies">
                                Baking Supplies
                            </option>

                            <option value="custom-order">
                                Custom Order
                            </option>

                            <option value="general-enquiry">
                                General Enquiry
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Name + Email -->
                <div class="book-form-row">

                    <div class="book-form-group">

                        <label for="customer-name">
                            Full Name
                        </label>

                        <div class="book-input-wrapper">

                            <i data-lucide="user"></i>

                            <input
                                type="text"
                                id="customer-name"
                                name="customer-name"
                                placeholder="Enter your full name"
                                required>

                        </div>

                    </div>


                    <div class="book-form-group">

                        <label for="customer-email">
                            Email Address
                        </label>

                        <div class="book-input-wrapper">

                            <i data-lucide="mail"></i>

                            <input
                                type="email"
                                id="customer-email"
                                name="customer-email"
                                placeholder="Enter your email"
                                required>

                        </div>

                    </div>

                </div>


                <!-- Phone + Date -->
                <div class="book-form-row">

                    <div class="book-form-group">

                        <label for="customer-phone">
                            Phone Number
                        </label>

                        <div class="book-input-wrapper">

                            <i data-lucide="phone"></i>

                            <input
                                type="tel"
                                id="customer-phone"
                                name="customer-phone"
                                placeholder="Enter your phone number"
                                required>

                        </div>

                    </div>


                    <div class="book-form-group">

                        <label for="required-date">
                            Required Date
                        </label>

                        <div class="book-input-wrapper">

                            <i data-lucide="calendar-days"></i>

                            <input
                                type="date"
                                id="required-date"
                                name="required-date">

                        </div>

                    </div>

                </div>


                <!-- Quantity + Budget -->
                <div class="book-form-row">

                    <div class="book-form-group">

                        <label for="quantity">
                            Quantity
                        </label>

                        <div class="book-input-wrapper">

                            <i data-lucide="package"></i>

                            <input
                                type="number"
                                id="quantity"
                                name="quantity"
                                min="1"
                                placeholder="Enter quantity">

                        </div>

                    </div>


                    <div class="book-form-group">

                        <label for="budget">
                            Budget Range
                        </label>

                        <div class="book-input-wrapper">

                            <i data-lucide="indian-rupee"></i>

                            <select
                                id="budget"
                                name="budget">

                                <option value="">
                                    Select budget
                                </option>

                                <option value="under-5000">
                                    Under ₹5,000
                                </option>

                                <option value="5000-15000">
                                    ₹5,000 – ₹15,000
                                </option>

                                <option value="15000-30000">
                                    ₹15,000 – ₹30,000
                                </option>

                                <option value="30000-50000">
                                    ₹30,000 – ₹50,000
                                </option>

                                <option value="above-50000">
                                    Above ₹50,000
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- Message -->
                <div class="book-form-group">

                    <label for="customer-message">
                        Tell Us More
                    </label>

                    <div class="book-input-wrapper book-textarea-wrapper">

                        <i data-lucide="message-square"></i>

                        <textarea
                            id="customer-message"
                            name="customer-message"
                            rows="5"
                            placeholder="Tell us about your requirements..."></textarea>

                    </div>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="book-submit-button">

                    Submit Enquiry

                    <i data-lucide="arrow-right"></i>

                </button>


                <span class="book-form-note">

                    <i data-lucide="shield-check"></i>

                    Your information will only be used
                    to respond to your enquiry.

                </span>

            </form>

        </div>

    </main>
